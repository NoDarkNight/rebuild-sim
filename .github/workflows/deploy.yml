# Builds the game and publishes it to GitHub Pages on every push to main.
# Requires Settings > Pages > Source set to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push cancels an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # Project sites live under /<repo-name>/.
          BASE_PATH: /${{ github.event.repository.name }}/
          # Optional TURN relay for online play across networks (see src/net/ice.ts).
          # Set as repo secrets; unset ones are simply empty. Values end up in the
          # public site, so use credentials meant for browser use.
          VITE_TURN_CREDENTIALS_URL: ${{ secrets.TURN_CREDENTIALS_URL }}
          VITE_TURN_URLS: ${{ secrets.TURN_URLS }}
          VITE_TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
